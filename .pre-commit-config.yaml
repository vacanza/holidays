repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-yaml
      - id: end-of-file-fixer
      - id: file-contents-sorter
        args:
          - --unique
        files: CONTRIBUTORS
      - id: mixed-line-ending
        args:
          - --fix=lf
        exclude: make.cmd
      - id: trailing-whitespace
        exclude: \.md$

  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --keep-runtime-typing
          - --py311-plus

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # v0.49.1
    hooks:
      - id: markdownlint
        args:
          - --fix
        files: \.md$

  - repo: https://github.com/lucas-c/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8  # v1.5.6
    hooks:
      - id: insert-license
        name: check license headers
        files: \.(po|py)$
        args:
          - --license-filepath
          - docs/file_header.txt

  - repo: https://github.com/pycqa/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # 9.0.2
    hooks:
      - id: isort
        exclude: ^(docs)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-polib==1.2.0.20260518
          - types-python-dateutil==2.9.0.20260807

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: a72ae8edd6eeddb9d942168912362945651212f8  # v2.30.1
    hooks:
      - id: pyproject-fmt

  - repo: local
    hooks:
      - id: normalize-unicode
        name: normalize unicode punctuation
        entry: python scripts/normalize_text.py
        language: system
        types: [text]
        exclude: ^(CHANGES\.md|scripts/normalize_text\.py)$
      - id: tests
        always_run: true
        entry: make check
        language: system
        name: run `make check`
        pass_filenames: false
        stages:
          - pre-push
