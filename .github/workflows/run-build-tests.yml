name: Build tests

on:
  workflow_call:
    inputs:
      environment:
        description: pre-release or release
        required: true
        type: string
      ref:
        description: Git ref or SHA to check out
        required: true
        type: string
      release_tag:
        description: GitHub release tag for SBOM naming (release only)
        required: false
        type: string
        default: ''

env:
  DEFAULT_PYTHON_VERSION: '3.14'
  FORCE_COLOR: 1

permissions: {}

jobs:
  build:
    name: Build distribution
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --no-install-project --group build --link-mode=copy --no-build

      - name: Set pre-release version
        if: inputs.environment == 'pre-release'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          # Calendar .devN is unique only because publish-pre-release.yml concurrency
          # serializes runs (cancel-in-progress: false). Keep .devN within u64 for uv.
          echo "${version}.dev$(date -u +%Y%m%d%H%M%S)" > VERSION

      - name: Build distribution
        run: make package

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist

      - name: Set version
        if: inputs.environment == 'release'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Generate SBOM
        if: inputs.environment == 'release'
        run: make sbom > "holidays-${VERSION}-sbom.json"

      - name: Upload SBOM
        if: inputs.environment == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: holidays-${{ env.VERSION }}-sbom.json

  test-build:
    name: Test build on ${{ matrix.os }} (${{ matrix.dist.name }})
    needs:
      - build
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        dist:
          - name: wheel
            artifact: dist/*.whl
          - name: sdist
            artifact: dist/*.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        shell: bash
        run: uv python install "$UV_PYTHON"

      - name: Get package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run tests
        shell: bash
        run: |
          rm -rf holidays
          uv run --frozen --isolated --no-default-groups --group tests --with ${{ matrix.dist.artifact }} -- pytest --dist loadscope --numprocesses auto tests/countries tests/financial

  test-docs:
    name: Test docs build
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --no-install-project --group docs --link-mode=copy --no-build

      - name: Build docs
        run: make doc
