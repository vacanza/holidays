name: Build tests

on:
  workflow_call:
    inputs:
      environment:
        description: pre-release or release
        required: true
        type: string
      ref:
        description: Git ref or SHA to check out
        required: true
        type: string
      release_tag:
        description: GitHub release tag for SBOM naming (release only)
        required: false
        type: string
        default: ''

env:
  DEFAULT_PYTHON_VERSION: '3.14'
  FORCE_COLOR: 1

permissions: {}

jobs:
  build:
    name: Build distribution
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --no-install-project --group build --link-mode=copy --no-build

      - name: Set pre-release version
        if: inputs.environment == 'pre-release'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          # Calendar .devN stays unique because the publish-release.yml pre-release
          # concurrency group runs one build at a time. cancel-in-progress: false
          # lets an upload already in progress finish. Keep .devN within u64 for uv.
          echo "${version}.dev$(date -u +%Y%m%d%H%M%S)" > VERSION

      - name: Build distribution
        run: make package

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist

      - name: Set version
        if: inputs.environment == 'release'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Generate SBOM
        if: inputs.environment == 'release'
        run: make sbom > "holidays-${VERSION}-sbom.json"

      - name: Upload SBOM
        if: inputs.environment == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: holidays-${{ env.VERSION }}-sbom.json

  test-build:
    name: Test build on ${{ matrix.os }} (${{ matrix.dist.name }})
    needs:
      - build
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        dist:
          - name: wheel
            artifact: dist/*.whl
          - name: sdist
            artifact: dist/*.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        shell: bash
        run: uv python install "$UV_PYTHON"

      - name: Get package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Run tests
        shell: bash
        run: |
          rm -rf holidays
          uv run --frozen --isolated --no-default-groups --group tests --with ${{ matrix.dist.artifact }} -- pytest --dist loadscope --numprocesses auto tests/countries tests/financial

  test-docs:
    name: Test docs build
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --no-install-project --group docs --link-mode=copy --no-build

      - name: Build docs
        run: make doc
