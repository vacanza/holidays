name: Code tests

on:
  workflow_call:
    inputs:
      full:
        default: true
        description: Run every Python version on every OS image
        required: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  DEFAULT_PYTHON_VERSION: '3.14'
  FORCE_COLOR: 1

permissions: {}

jobs:
  default-python:
    name: Set default Python version
    permissions: {}
    runs-on: ubuntu-26.04-arm
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - name: Publish default Python version
        id: set
        run: echo "version=${DEFAULT_PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: default-python
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    # pull_request sets full=false: every Python on ubuntu-26.04, and
    # DEFAULT_PYTHON_VERSION on the other images. That version must also be in
    # python-version. strategy cannot read env, so the job above publishes it.
    # Other events run the full cross product. A new OS image needs an entry
    # in both os lists.
    #
    # previous: macos-15, ubuntu-24.04, windows-2022
    # latest:   macos-26, ubuntu-26.04, windows-2025
    strategy:
      matrix:
        os: >-
          ${{ fromJSON(inputs.full && '[
            "macos-15",
            "macos-26",
            "ubuntu-24.04",
            "ubuntu-26.04",
            "windows-2022",
            "windows-2025"
          ]' || '["ubuntu-26.04"]') }}
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        include: >-
          ${{ fromJSON(inputs.full && '[]' || format('[
            {{
              "os": "macos-15",
              "python-version": "{0}"
            }},
            {{
              "os": "macos-26",
              "python-version": "{0}"
            }},
            {{
              "os": "ubuntu-24.04",
              "python-version": "{0}"
            }},
            {{
              "os": "windows-2022",
              "python-version": "{0}"
            }},
            {{
              "os": "windows-2025",
              "python-version": "{0}"
            }}
          ]', needs.default-python.outputs.version)) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version-file: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --no-dev --group tests --link-mode=copy --no-build --no-binary-package holidays

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
