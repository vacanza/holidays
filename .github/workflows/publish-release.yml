name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_run:
    workflows:
      - CI
    types:
      - completed

env:
  FORCE_COLOR: 1

concurrency:
  cancel-in-progress: false
  group: >-
    ${{
      github.event_name == 'release'
      && format('{0}-publish-release-{1}', github.repository, github.event.release.tag_name)
      || format('{0}-publish-pre-release-dev', github.repository)
    }}

permissions: {}

jobs:
  check-pre-release:
    name: Check pre-release
    if: |
      github.event_name == 'workflow_run' &&
      github.repository == 'vacanza/holidays' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      # Decide from local git commit metadata.
      - name: Decide whether to publish
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { execFileSync } = require('child_process')
            const commit = (fmt) =>
              execFileSync('git', ['log', '-1', `--format=${fmt}`], {
                encoding: 'utf8',
              }).trim()
            const isBot = (name, email) => {
              const bots = ['dependabot[bot]', 'github-actions[bot]']
              return bots.includes(name) || bots.some((bot) => email.includes(`${bot}@`))
            }
            const isBotCoAuthor = (message) =>
              message.split('\n').some((line) => {
                const match = line.match(/^Co-authored-by:\s*(.+?)(?:\s*<([^>]+)>)?\s*$/i)
                return match && isBot(match[1].trim(), (match[2] || '').trim())
              })
            const authorEmail = commit('%ae')
            const authorName = commit('%an')
            const message = commit('%B')
            const parents = commit('%P').split(/\s+/).filter(Boolean)
            const subject = commit('%s')

            let publish = true
            let reason = 'publish: passed pre-release checks'

            // Merge commits are mainly main to dev syncs.
            if (parents.length > 1) {
              publish = false
              reason = `skip: merge commit (${subject})`
            } else if (/^(Initialize|Finalize) v/.test(subject)) {
              // Usually direct pushes to dev (no PR).
              publish = false
              reason = `skip: release chore commit (${subject})`
            } else if (/\[skip publish\]/i.test(subject)) {
              publish = false
              reason = 'skip: commit subject contains [skip publish]'
            } else if (isBot(authorName, authorEmail)) {
              publish = false
              reason = `skip: bot commit author (${authorName} <${authorEmail}>)`
            } else if (isBotCoAuthor(message)) {
              publish = false
              reason = 'skip: bot co-author'
            }

            core.info(reason)
            core.setOutput('publish', publish ? 'true' : 'false')

  check-release:
    name: Check release
    if: |
      github.event_name == 'release' &&
      github.repository == 'vacanza/holidays' &&
      startsWith(github.event.release.tag_name, 'v')
    outputs:
      tag_commit: ${{ steps.verify.outputs.tag_commit }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Verify tag commit belongs to main
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag ${RELEASE_TAG} (${tag_commit}) is not on main." >&2
            exit 1
          fi
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"

  # Build/test are reusable; PyPI upload must stay top-level (Trusted Publishing).
  # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
  # https://github.com/pypa/gh-action-pypi-publish/issues/166
  # always() so the skipped entry job does not skip the build.
  build:
    name: Build and test
    needs:
      - check-pre-release
      - check-release
    if: |
      always() &&
      !cancelled() &&
      (
        needs.check-pre-release.outputs.publish == 'true' ||
        needs.check-release.result == 'success'
      )
    permissions:
      contents: read
    uses: ./.github/workflows/run-build-tests.yml
    with:
      environment: ${{ github.event_name == 'release' && 'release' || 'pre-release' }}
      ref: ${{ github.event_name == 'release' && needs.check-release.outputs.tag_commit || github.event.workflow_run.head_sha }}
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  publish:
    name: Publish to PyPI
    needs:
      - build
    if: always() && needs.build.result == 'success'
    environment: ${{ github.event_name == 'release' && 'release' || 'pre-release' }}
    permissions:
      id-token: write
    # gh-action-pypi-publish ships an amd64-only image.
    # https://github.com/pypa/gh-action-pypi-publish/issues/356
    runs-on: ubuntu-26.04
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  sign-artifacts:
    name: Create SHA256 checksums and Sigstore signatures
    needs:
      - publish
    if: always() && github.event_name == 'release' && needs.publish.result == 'success'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Compute SHA256 checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Sign the files using Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Upload package dist and signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-artifacts
          path: dist

  update-github-release:
    name: Update GitHub release with SBOM and signed artifacts
    needs:
      - sign-artifacts
    if: always() && github.event_name == 'release' && needs.sign-artifacts.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom

      - name: Download package dist and signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-artifacts
          path: dist

      - name: Update Github release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload --clobber --repo vacanza/holidays "$RELEASE_TAG" dist/*
          gh release upload --clobber --repo vacanza/holidays "$RELEASE_TAG" holidays-*-sbom.json
