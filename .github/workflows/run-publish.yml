name: Run publish

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment for the release
        required: true
        type: string
      ref:
        description: Git ref or SHA to check out
        required: true
        type: string
      release_tag:
        description: GitHub release tag for SBOM naming and release uploads
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_TOKEN:
        required: true

env:
  DEFAULT_PYTHON_VERSION: '3.14'
  DEFAULT_UV_VERSION: '0.11.24'
  FORCE_COLOR: 1

permissions: {}

jobs:
  build:
    name: Build distribution
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version: ${{ env.DEFAULT_UV_VERSION }}

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --no-install-project --group build --link-mode=copy

      - name: Set pre-release version
        if: inputs.environment == 'pre-release'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "${version}.dev$(date -u +%Y%m%d%H%M)" > VERSION

      - name: Build distribution
        run: make package

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist

      - name: Set version
        if: inputs.environment == 'release'
        run: echo "VERSION=$(echo "${{ inputs.release_tag }}" | sed 's/^v//')" >> "$GITHUB_ENV"

      - name: Generate SBOM
        if: inputs.environment == 'release'
        run: make sbom > holidays-${{ env.VERSION }}-sbom.json

      - name: Upload SBOM
        if: inputs.environment == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: holidays-${{ env.VERSION }}-sbom.json

  test-build:
    name: Test build on ${{ matrix.os }} (${{ matrix.dist.name }})
    needs:
      - build
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        dist:
          - name: wheel
            artifact: dist/*.whl
          - name: sdist
            artifact: dist/*.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version: ${{ env.DEFAULT_UV_VERSION }}

      - name: Install Python
        shell: bash
        run: uv python install "$UV_PYTHON"

      - name: Get package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run tests
        shell: bash
        run: |
          rm -rf holidays
          uv run --isolated --no-default-groups --group tests --with ${{ matrix.dist.artifact }} -- pytest --dist loadscope --numprocesses auto tests/countries tests/financial

  publish:
    name: Publish generated artifacts
    if: github.repository == 'vacanza/holidays'
    environment: ${{ inputs.environment }}
    needs:
      - test-build
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  sign-artifacts:
    name: Create SHA1 checksums and Sigstore signatures
    if: inputs.environment == 'release'
    needs:
      - publish
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Compute SHA1 checksums
        run: |
          cd dist
          for file in *; do
            sha1sum "$file" > "$file.sha1"
          done

      - name: Sign the files using Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1  # v3.4.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Upload package dist and signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-artifacts
          path: dist

  update-github-release:
    name: Update GitHub release with SBOM and signed artifacts
    if: inputs.environment == 'release'
    needs:
      - sign-artifacts
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom

      - name: Download package dist and signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-artifacts
          path: dist

      - name: Update Github release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload --repo vacanza/holidays ${{ inputs.release_tag }} dist/*
          gh release upload --repo vacanza/holidays ${{ inputs.release_tag }} holidays-*-sbom.json
